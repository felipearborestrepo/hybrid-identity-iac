# Runs Terraform through HCP Terraform (Terraform Cloud).
#   Pull request  -> fmt check, validate, plan, and the plan is posted as a PR comment.
#   Merge to main -> apply (the PR review is the approval step).
name: terraform

on:
  pull_request:
    paths:
      - "phase1-entra/**"
      - "phase3-okta/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "phase1-entra/**"
      - "phase3-okta/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  terraform:
    name: ${{ matrix.dir }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Folders the pipeline manages. Add phase1-entra here once its
        # HCP Terraform workspace and service principal are set up.
        dir: [phase3-okta]
    defaults:
      run:
        shell: bash
        working-directory: ${{ matrix.dir }}
    env:
      # Lets Terraform log in to HCP Terraform. Cloud credentials (like the
      # Okta API token) live in the HCP Terraform workspace, not in GitHub.
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
      TF_IN_AUTOMATION: "true"

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false

      - name: Format check
        run: terraform fmt -check -diff

      - name: Init (connects to HCP Terraform)
        run: terraform init -input=false

      - name: Validate
        run: terraform validate -no-color

      - name: Plan
        if: github.event_name == 'pull_request'
        run: terraform plan -no-color -input=false 2>&1 | tee plan.txt

      - name: Post the plan on the pull request
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        env:
          DIR: ${{ matrix.dir }}
        with:
          script: |
            const fs = require('fs');
            const path = `${process.env.DIR}/plan.txt`;
            let plan = fs.existsSync(path) ? fs.readFileSync(path, 'utf8') : 'Plan did not run. Check the job log.';
            if (plan.length > 60000) plan = '...(truncated)...\n' + plan.slice(-60000);
            const summary = (plan.match(/Plan: .*|No changes\..*/) || ['See details'])[0];
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `### Terraform plan: \`${process.env.DIR}\`\n**${summary}**\n<details><summary>Full plan</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n</details>`
            });

      - name: Apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: terraform apply -auto-approve -input=false -no-color
